<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a9d8f"/>
      <stop offset="100%" style="stop-color:#1a7a6e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e76f51"/>
      <stop offset="100%" style="stop-color:#c45a3d"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a84c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid dots -->
  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="900" height="620" fill="url(#dots)" rx="16"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.5">TravelMind AI — System Architecture</text>
  <text x="450" y="62" text-anchor="middle" fill="#4a5568" font-size="11" letter-spacing="2">AGENTIC RAG · LANGGRAPH · QDRANT · FASTAPI</text>

  <!-- ─── Client Layer ─── -->
  <rect x="30" y="90" width="200" height="110" rx="12" fill="#1c2333" stroke="#2a9d8f" stroke-width="1.5"/>
  <rect x="30" y="90" width="200" height="28" rx="12" fill="url(#tealGrad)"/>
  <rect x="30" y="106" width="200" height="12" rx="0" fill="url(#tealGrad)"/>
  <text x="130" y="109" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="1">CLIENT LAYER</text>
  <text x="50" y="135" fill="#a0aec0" font-size="10">🌐  Web Browser (HTML/JS)</text>
  <text x="50" y="152" fill="#a0aec0" font-size="10">⚡  WebSocket Stream</text>
  <text x="50" y="169" fill="#a0aec0" font-size="10">🔗  REST API Fallback</text>
  <text x="50" y="186" fill="#a0aec0" font-size="10">🌍  Multilingual UI (11 langs)</text>

  <!-- ─── API Gateway ─── -->
  <rect x="300" y="90" width="200" height="110" rx="12" fill="#1c2333" stroke="#c9a84c" stroke-width="1.5"/>
  <rect x="300" y="90" width="200" height="28" rx="12" fill="url(#goldGrad)"/>
  <rect x="300" y="106" width="200" height="12" rx="0" fill="url(#goldGrad)"/>
  <text x="400" y="109" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="1">API GATEWAY</text>
  <text x="320" y="135" fill="#a0aec0" font-size="10">🚀  FastAPI + Uvicorn</text>
  <text x="320" y="152" fill="#a0aec0" font-size="10">🛡️  Rate Limiting (SlowAPI)</text>
  <text x="320" y="169" fill="#a0aec0" font-size="10">🔌  WebSocket Manager</text>
  <text x="320" y="186" fill="#a0aec0" font-size="10">🐳  Docker / Docker Compose</text>

  <!-- ─── Memory & Storage ─── -->
  <rect x="570" y="90" width="300" height="110" rx="12" fill="#1c2333" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="570" y="90" width="300" height="28" rx="12" fill="url(#purpleGrad)"/>
  <rect x="570" y="106" width="300" height="12" rx="0" fill="url(#purpleGrad)"/>
  <text x="720" y="109" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="1">STORAGE LAYER</text>
  <text x="590" y="135" fill="#a0aec0" font-size="10">🔵  Qdrant — Vector Store (cosine similarity)</text>
  <text x="590" y="152" fill="#a0aec0" font-size="10">🗄️  SQLite — Trips, Itineraries, Memory</text>
  <text x="590" y="169" fill="#a0aec0" font-size="10">🔴  Redis — Conversation History Cache</text>
  <text x="590" y="186" fill="#a0aec0" font-size="10">⚡  GPTCache — Semantic Response Cache</text>

  <!-- ─── Agentic RAG Core ─── -->
  <rect x="180" y="250" width="540" height="200" rx="14" fill="#111827" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="450" y="272" text-anchor="middle" fill="#2a9d8f" font-size="10" font-weight="700" letter-spacing="2">AGENTIC RAG ENGINE  (LangGraph StateGraph)</text>

  <!-- LangGraph nodes -->
  <!-- Language Det -->
  <rect x="200" y="282" width="110" height="46" rx="8" fill="#1f2d3d" stroke="#2a9d8f" stroke-width="1"/>
  <text x="255" y="300" text-anchor="middle" fill="#63b3ed" font-size="9" font-weight="600">LANGUAGE</text>
  <text x="255" y="312" text-anchor="middle" fill="#63b3ed" font-size="9" font-weight="600">DETECTION</text>
  <text x="255" y="323" text-anchor="middle" fill="#4a5568" font-size="8">+ Translation</text>

  <!-- Intent Classifier -->
  <rect x="330" y="282" width="110" height="46" rx="8" fill="#1f2d3d" stroke="#c9a84c" stroke-width="1"/>
  <text x="385" y="300" text-anchor="middle" fill="#f6e05e" font-size="9" font-weight="600">INTENT</text>
  <text x="385" y="312" text-anchor="middle" fill="#f6e05e" font-size="9" font-weight="600">CLASSIFIER</text>
  <text x="385" y="323" text-anchor="middle" fill="#4a5568" font-size="8">Rule-based + LLM</text>

  <!-- Router -->
  <rect x="460" y="282" width="110" height="46" rx="8" fill="#1f2d3d" stroke="#e76f51" stroke-width="1"/>
  <text x="515" y="300" text-anchor="middle" fill="#fc8181" font-size="9" font-weight="600">SMART</text>
  <text x="515" y="312" text-anchor="middle" fill="#fc8181" font-size="9" font-weight="600">ROUTER</text>
  <text x="515" y="323" text-anchor="middle" fill="#4a5568" font-size="8">4 intent paths</text>

  <!-- Retrievers row -->
  <rect x="200" y="348" width="100" height="42" rx="8" fill="#1f2d3d" stroke="#2a9d8f" stroke-width="1"/>
  <text x="250" y="365" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">VECTOR</text>
  <text x="250" y="377" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">RETRIEVER</text>
  <text x="250" y="386" text-anchor="middle" fill="#4a5568" font-size="7.5">BM25 + embeddings</text>

  <rect x="315" y="348" width="100" height="42" rx="8" fill="#1f2d3d" stroke="#2a9d8f" stroke-width="1"/>
  <text x="365" y="365" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">WEB SEARCH</text>
  <text x="365" y="377" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">NODE</text>
  <text x="365" y="386" text-anchor="middle" fill="#4a5568" font-size="7.5">DuckDuckGo live</text>

  <rect x="430" y="348" width="100" height="42" rx="8" fill="#1f2d3d" stroke="#2a9d8f" stroke-width="1"/>
  <text x="480" y="365" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">ITINERARY</text>
  <text x="480" y="377" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">PLANNER</text>
  <text x="480" y="386" text-anchor="middle" fill="#4a5568" font-size="7.5">Trip auto-update</text>

  <rect x="545" y="348" width="100" height="42" rx="8" fill="#1f2d3d" stroke="#2a9d8f" stroke-width="1"/>
  <text x="595" y="365" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">MEMORY</text>
  <text x="595" y="377" text-anchor="middle" fill="#68d391" font-size="8.5" font-weight="600">CONTEXT</text>
  <text x="595" y="386" text-anchor="middle" fill="#4a5568" font-size="7.5">Summarize at N=10</text>

  <!-- Generator -->
  <rect x="315" y="408" width="240" height="30" rx="8" fill="#1c2f1c" stroke="#68d391" stroke-width="1.5"/>
  <text x="435" y="428" text-anchor="middle" fill="#68d391" font-size="10" font-weight="600">GPT-4.1-mini GENERATOR  (streaming token output)</text>

  <!-- ─── External Services ─── -->
  <rect x="30" y="490" width="200" height="110" rx="12" fill="#1c2333" stroke="#e76f51" stroke-width="1.5"/>
  <rect x="30" y="490" width="200" height="28" rx="12" fill="url(#roseGrad)"/>
  <rect x="30" y="506" width="200" height="12" rx="0" fill="url(#roseGrad)"/>
  <text x="130" y="509" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="1">EXTERNAL SERVICES</text>
  <text x="50" y="535" fill="#a0aec0" font-size="10">🤖  OpenAI GPT-4.1-mini (Chat)</text>
  <text x="50" y="552" fill="#a0aec0" font-size="10">📐  text-embedding-3-small</text>
  <text x="50" y="569" fill="#a0aec0" font-size="10">🌐  DuckDuckGo Search API</text>
  <text x="50" y="586" fill="#a0aec0" font-size="10">🗺️  VLAD AI Tourism Data API</text>

  <!-- ─── Data Pipeline ─── -->
  <rect x="670" y="490" width="200" height="110" rx="12" fill="#1c2333" stroke="#c9a84c" stroke-width="1.5"/>
  <rect x="670" y="490" width="200" height="28" rx="12" fill="url(#goldGrad)"/>
  <rect x="670" y="506" width="200" height="12" rx="0" fill="url(#goldGrad)"/>
  <text x="770" y="509" text-anchor="middle" fill="white" font-size="10" font-weight="700" letter-spacing="1">SYNC PIPELINE</text>
  <text x="690" y="535" fill="#a0aec0" font-size="10">⏱  APScheduler (12h auto-sync)</text>
  <text x="690" y="552" fill="#a0aec0" font-size="10">✂️  Text Chunker (512 tokens)</text>
  <text x="690" y="569" fill="#a0aec0" font-size="10">🔢  Embedding Batch Processor</text>
  <text x="690" y="586" fill="#a0aec0" font-size="10">📊  BM25 Model Builder</text>

  <!-- ─── Arrows ─── -->
  <!-- Client → API -->
  <line x1="230" y1="145" x2="298" y2="145" stroke="#2a9d8f" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <!-- API → Agentic RAG -->
  <line x1="400" y1="200" x2="400" y2="248" stroke="#2a9d8f" stroke-width="1.5" marker-end="url(#arrow-teal)" stroke-dasharray="4,2"/>
  <!-- API → Storage -->
  <line x1="500" y1="145" x2="568" y2="145" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- LangGraph internal →→ -->
  <line x1="310" y1="305" x2="328" y2="305" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="305" x2="458" y2="305" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Router → Retrievers -->
  <line x1="515" y1="328" x2="480" y2="346" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="328" x2="370" y2="346" stroke="#4a5568" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Retrievers → Generator -->
  <line x1="350" y1="390" x2="380" y2="406" stroke="#68d391" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="435" y1="390" x2="435" y2="406" stroke="#68d391" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="390" x2="490" y2="406" stroke="#68d391" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- RAG → External -->
  <line x1="300" y1="450" x2="130" y2="488" stroke="#e76f51" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <!-- Sync → Storage -->
  <line x1="770" y1="488" x2="770" y2="202" stroke="#c9a84c" stroke-width="1.5" marker-end="url(#arrow-gold)" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <rect x="240" y="492" width="420" height="80" rx="10" fill="#111827" stroke="#2d3748" stroke-width="1"/>
  <text x="450" y="510" text-anchor="middle" fill="#4a5568" font-size="9" font-weight="600" letter-spacing="1.5">LEGEND</text>
  <line x1="265" y1="525" x2="295" y2="525" stroke="#2a9d8f" stroke-width="2"/>
  <text x="300" y="528" fill="#a0aec0" font-size="9">Query / Response Flow</text>
  <line x1="265" y1="542" x2="295" y2="542" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="300" y="545" fill="#a0aec0" font-size="9">Async / Internal Call</text>
  <line x1="415" y1="525" x2="445" y2="525" stroke="#c9a84c" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="450" y="528" fill="#a0aec0" font-size="9">Data Sync Pipeline</text>
  <line x1="415" y1="542" x2="445" y2="542" stroke="#e76f51" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="450" y="545" fill="#a0aec0" font-size="9">LLM API Calls</text>
  <line x1="556" y1="525" x2="586" y2="525" stroke="#68d391" stroke-width="2"/>
  <text x="591" y="528" fill="#a0aec0" font-size="9">Streaming Tokens</text>
  <line x1="556" y1="542" x2="586" y2="542" stroke="#7c3aed" stroke-width="2"/>
  <text x="591" y="545" fill="#a0aec0" font-size="9">Persistence</text>

  <text x="450" y="565" text-anchor="middle" fill="#2d3748" font-size="8">github.com/your-username/travelmind-ai</text>
</svg>
